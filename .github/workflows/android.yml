name: Build FSD SPIN APK

# Builds a debug APK automatically whenever code is pushed to GitHub.
# Download it from the workflow run's Artifacts section — no Android
# Studio needed just to try the app.
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fsd-spin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
