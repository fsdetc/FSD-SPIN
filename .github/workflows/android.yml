name: Build FSD SPIN APK

# Builds a debug APK automatically whenever code is pushed to GitHub.
# Download it from the workflow run's Artifacts section — no Android
# Studio needed just to try the app.
#
# Note: GitHub's ubuntu runners already ship with an Android SDK
# preinstalled (ANDROID_HOME is set), so no separate SDK setup step
# is used here — that step was failing on the runner image.
#
# The APK is renamed to FSD-SPIN.apk before upload, so downloads
# carry the real app name instead of app-debug.apk.
on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          # AGP 8.5.2 needs Gradle 8.7 (8.x), not the latest 9.x.
          gradle-version: 8.7
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Rename APK to the real app name
        run: cp app/build/outputs/apk/debug/app-debug.apk FSD-SPIN.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FSD-SPIN-apk
          path: FSD-SPIN.apk
